<style>
  :root{--ink:#211C16;--paper:#F6F2E9;--card:#FBF9F3;--line:#E3DCCB;--mut:#8B8270;

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;padding:24px 20px 60px}
  h1{font-family:'Fraunces',serif;font-weight:800;font-size:32px;margin:2px 0;line-height:1}
  h3{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0}
  .kick{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--terra);font-weight:700}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  .sub{color:var(--mut);font-size:13px}
  .controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .cgroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .clabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:700;margin-right:2px}
  button.pill{border:1.5px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  button.pill.on{background:var(--green);color:var(--paper);border-color:var(--green)}
  button.scope.on{background:var(--terra);border-color:var(--terra)}
  .emps{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 14px}
  button.emp{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
  button.emp .dot{width:8px;height:8px;border-radius:50%}
  button.emp.off{opacity:.35}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
  button.tab{border:none;background:transparent;color:var(--mut);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  button.tab.on{background:var(--ink);color:var(--paper)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px}
  .card.wide{grid-column:1/-1}
  .chead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
  .cnote{font-size:11px;color:var(--mut);text-align:right}
  .chart{width:100%;height:300px}
  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .kpi{flex:1 1 130px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:600}
  .kpi .v{font-family:'Fraunces',serif;font-weight:800;font-size:26px;margin-top:3px}
  .kpi .u{font-size:12px;color:var(--mut);font-weight:500}
  .upload{margin-left:auto;display:flex;gap:8px;align-items:center}
  button.up{background:var(--ink);color:var(--paper);border:none;border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  footer{margin-top:26px;font-size:11.5px;color:var(--mut);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
  a{color:var(--green)}
</style>
</head>

  document.querySelectorAll(".scope").forEach(b=>{b.classList.toggle("on",b.dataset.scope===state.scope);b.onclick=()=>{state.scope=b.dataset.scope;syncBtns();render();};});
  const ec=document.getElementById("emps");ec.innerHTML="";
  DATA.empresas.forEach(e=>{const b=el("button","emp"+(state.emps.has(e)?"":" off"));b.innerHTML=`<span class="dot" style="background:${empColor(e)}"></span>${e}`;b.onclick=()=>{state.emps.has(e)?state.emps.delete(e):state.emps.add(e);b.classList.toggle("off");render();};ec.appendChild(b);});
  const tb=document.getElementById("tabs");tb.innerHTML="";
  SECTIONS.forEach(s=>{const b=el("button","tab"+(s===state.section?" on":""),s);b.onclick=()=>{state.section=s;syncBtns();render();};tb.appendChild(b);});
  document.getElementById("subtitle").textContent=`Soja · Campaña ${CAMPLBL[state.cp]||state.cp} · Grupo El Palomar dentro del NOA`;
  document.getElementById("emps").style.display=(state.scope==="region")?"none":"flex";
}
function syncBtns(){
  document.querySelectorAll("#campBtns .pill").forEach(b=>b.classList.toggle("on",(CAMPLBL[state.cp]||state.cp)===b.textContent));
  document.querySelectorAll(".scope").forEach(b=>b.classList.toggle("on",b.dataset.scope===state.scope));
  document.querySelectorAll("#tabs .tab").forEach(b=>b.classList.toggle("on",b.textContent===state.section));
  document.getElementById("emps").style.display=(state.scope==="region")?"none":"flex";
}
let charts=[];
function card(wide,title,note){const c=el("div","card"+(wide?" wide":""));const h=el("div","chead");h.appendChild(el("h3",null,title));if(note)h.appendChild(el("span","cnote",note));c.appendChild(h);const ch=el("div","chart");c.appendChild(ch);return{c,ch};}
function mkChart(ch,opt){const inst=echarts.init(ch);inst.setOption(opt);charts.push(inst);}
const baseGrid={left:48,right:16,top:24,bottom:34};
const axStyle={axisLine:{lineStyle:{color:C.line}},axisLabel:{color:C.mut,fontSize:11},axisTick:{show:false}};
const splitLine={splitLine:{lineStyle:{color:C.line}}};

/* ============ render ============ */
function render(){
  charts.forEach(c=>c.dispose());charts=[];

function kpiRow(items){const d=el("div","kpis");items.forEach(k=>{const e=el("div","kpi");e.innerHTML=`<div class="l">${k.l}</div><div class="v">${k.v}<span class="u"> ${k.u||""}</span></div>`;d.appendChild(e);});return d;}
function grid(){return el("div","grid");}

/* ---- RESUMEN ---- */
function secResumen(app){
  const g=grpRecs(),reg=regRecs();
  const rg=wavg(g,"ri"),rr=wavg(reg,"ri");
  const part=reg.length?100*g.length/reg.length:0;
  app.appendChild(kpiRow([
    {l:"Rinde grupo",v:fmt(rg),u:"kg/ha"},
    {l:"Rinde NOA",v:fmt(rr),u:"kg/ha"},
    {l:"Δ vs región",v:(rg-rr>=0?"+":"")+fmt(rg-rr),u:"kg/ha"},
    {l:"Lotes grupo",v:g.length},
    {l:"Superficie",v:fmt(g.reduce((a,r)=>a+(r.sc||0),0)),u:"ha"},
    {l:"Participación",v:f1(part),u:"% NOA"},
  ]));
  const gr=grid();app.appendChild(gr);
  // rinde por empresa
  const byE={};g.forEach(r=>{if(!r.em)return;(byE[r.em]=byE[r.em]||[]).push(r);});
  const emps=Object.keys(byE).map(e=>({e,v:Math.round(wavg(byE[e],"ri")),c:empColor(e)})).sort((a,b)=>b.v-a.v);
  let o=card(false,"Rendimiento por empresa","kg/ha · línea = promedio NOA");gr.appendChild(o.c);
  const empsR=[...emps].reverse();
  mkChart(o.ch,{grid:{...baseGrid,left:140,right:60},tooltip:{trigger:"axis"},yAxis:{type:"category",data:empsR.map(x=>x.e),...axStyle,axisLabel:{...axStyle.axisLabel,fontSize:11}},xAxis:{type:"value",...axStyle,...splitLine},
    series:[{type:"bar",data:empsR.map(x=>({value:x.v,itemStyle:{color:x.c,borderRadius:[0,4,4,0]}})),label:{show:true,position:"right",formatter:p=>fmt(p.value),color:C.ink,fontSize:10},markLine:{silent:true,symbol:"none",lineStyle:{color:C.terra,type:"dashed"},data:[{xAxis:Math.round(rr)}],label:{formatter:"NOA "+fmt(rr),color:C.terra,fontSize:10,position:"insideEndTop"}}}]});
  // distribución de rindes
  const bins=[0,1500,2500,3000,3500,4000,4500,9999],lbl=["<1500","1500-2500","2500-3000","3000-3500","3500-4000","4000-4500",">4500"];
  const hist=rs=>{const c=Array(lbl.length).fill(0);rs.forEach(r=>{if(r.ri==null)return;for(let i=0;i<bins.length-1;i++){if(r.ri>=bins[i]&&r.ri<bins[i+1]){c[i]++;break;}}});const t=c.reduce((a,b)=>a+b,0)||1;return c.map(x=>Math.round(100*x/t));};
  o=card(false,"Distribución de rendimientos","% de lotes");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,bottom:44},tooltip:{trigger:"axis",valueFormatter:v=>v+"%"},legend:{bottom:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:lbl,...axStyle,axisLabel:{...axStyle.axisLabel,rotate:30,fontSize:9}},yAxis:{type:"value",...axStyle,...splitLine,axisLabel:{...axStyle.axisLabel,formatter:"{value}%"}},
    series:[{name:"El Palomar",type:"bar",data:hist(g),itemStyle:{color:C.green,borderRadius:[3,3,0,0]}},{name:"NOA",type:"bar",data:hist(reg),itemStyle:{color:C.reg,borderRadius:[3,3,0,0]}}]});
}

/* ---- AGUA ---- */
function secAgua(app){
  const g=grpRecs(),reg=regRecs();

  const monthly=rs=>MES.map((_,i)=>{const v=rs.map(r=>r.ppm&&r.ppm[i]).filter(x=>x!=null);return v.length?Math.round(mean(v)):0;});
  const gr=grid();app.appendChild(gr);
  let o=card(true,"Lluvias de campaña (sep→may)","mm promedio por mes");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,bottom:40},tooltip:{trigger:"axis",valueFormatter:v=>v+" mm"},legend:{bottom:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:MES,...axStyle},yAxis:{type:"value",...axStyle,...splitLine},
    series:[{name:"El Palomar",type:"line",smooth:true,data:monthly(g),lineStyle:{color:C.green,width:2},itemStyle:{color:C.green},areaStyle:{color:"rgba(47,93,58,.08)"}},
            {name:"NOA",type:"line",smooth:true,data:monthly(reg),lineStyle:{color:C.reg,width:2},itemStyle:{color:C.reg}}]});
  // rinde por zona (region)

  const zonas=Object.keys(byZ).map(z=>({z,v:Math.round(wavg(byZ[z],"ri")),pp:Math.round(mean(byZ[z].map(r=>r.pp).filter(x=>x!=null))),n:byZ[z].length})).filter(x=>x.n>=3).sort((a,b)=>b.v-a.v).slice(0,12);
  o=card(false,"Rinde y lluvia por departamento (NOA)","kg/ha y mm · ≥3 lotes");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,right:48,bottom:56},tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:zonas.map(x=>x.z),...axStyle,axisLabel:{...axStyle.axisLabel,rotate:35,fontSize:9}},
    yAxis:[{type:"value",name:"kg/ha",...axStyle,...splitLine},{type:"value",name:"mm",...axStyle,splitLine:{show:false}}],
    series:[{name:"Rinde",type:"bar",data:zonas.map(x=>x.v),itemStyle:{color:C.green,borderRadius:[4,4,0,0]}},{name:"Lluvia",type:"line",yAxisIndex:1,data:zonas.map(x=>x.pp),lineStyle:{color:C.blue},itemStyle:{color:C.blue}}]});
  // rinde vs pp scatter
  o=card(false,"Rinde vs lluvia de campaña","cada punto un lote");gr.appendChild(o.c);
  const pts=rs=>rs.filter(r=>r.pp!=null&&r.ri!=null).map(r=>[r.pp,r.ri]);
  mkChart(o.ch,{grid:baseGrid,tooltip:{trigger:"item",formatter:p=>`${p.value[0]} mm · ${fmt(p.value[1])} kg/ha`},legend:{bottom:0,textStyle:{fontSize:11}},
    xAxis:{type:"value",name:"mm",...axStyle,...splitLine},yAxis:{type:"value",name:"kg/ha",...axStyle,...splitLine},
    series:[{name:"NOA",type:"scatter",data:pts(reg.filter(r=>!r.gr)),symbolSize:6,itemStyle:{color:"rgba(176,164,140,.55)"}},
            {name:"El Palomar",type:"scatter",data:pts(g),symbolSize:7,itemStyle:{color:C.green}}]});
}

/* ---- GENÉTICA ---- */
function secGenetica(app){
  const g=grpRecs(),reg=regRecs();
  const nvG=new Set(g.map(r=>r.va).filter(Boolean)).size,nvR=new Set(reg.map(r=>r.va).filter(Boolean)).size;
  app.appendChild(kpiRow([{l:"Variedades grupo",v:nvG},{l:"Variedades NOA",v:nvR},{l:"Lotes grupo",v:g.length}]));
  const gr=grid();app.appendChild(gr);
  // composición varietal grupo (share superficie)
  const shareBy=(rs,key)=>{const m={};let t=0;rs.forEach(r=>{const k=r[key];if(!k||!r.sc)return;m[k]=(m[k]||0)+r.sc;t+=r.sc;});return Object.entries(m).map(([k,v])=>({k,v:Math.round(100*v/t),rinde:Math.round(wavg(rs.filter(x=>x[key]===k),"ri"))})).sort((a,b)=>b.v-a.v);};
  const cg=shareBy(g,"va").slice(0,12);
  let o=card(false,"Composición varietal · El Palomar","% de superficie");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,left:120},tooltip:{trigger:"item",formatter:p=>`${p.name}: ${p.value}% sup · ${fmt(cg[p.dataIndex].rinde)} kg/ha`},
    xAxis:{type:"value",...axStyle,...splitLine,axisLabel:{...axStyle.axisLabel,formatter:"{value}%"}},yAxis:{type:"category",data:cg.map(x=>x.k).reverse(),...axStyle,axisLabel:{...axStyle.axisLabel,fontSize:10}},
    series:[{type:"bar",data:cg.map(x=>x.v).reverse(),itemStyle:{color:C.green,borderRadius:[0,4,4,0]}}]});
  // performance por GM grupo vs region
  const gmAgg=rs=>{const m={};rs.forEach(r=>{const b=gmBanda(gmOf(r.va));if(!b)return;(m[b]=m[b]||[]).push(r);});return m;};
  const mg=gmAgg(g),mr=gmAgg(reg);
  const bands=[...new Set([...Object.keys(mg),...Object.keys(mr)])].sort((a,b)=>{const o=["V corto","V medio","V largo","VI corto","VI medio","VI largo","VII corto","VII medio","VII largo","VIII corto","VIII medio","VIII largo"];return o.indexOf(a)-o.indexOf(b);});
  o=card(false,"Performance por grupo de madurez","kg/ha ponderado");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,bottom:48},tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:bands,...axStyle,axisLabel:{...axStyle.axisLabel,rotate:30,fontSize:9}},yAxis:{type:"value",...axStyle,...splitLine},
    series:[{name:"El Palomar",type:"bar",data:bands.map(b=>mg[b]?Math.round(wavg(mg[b],"ri")):null),itemStyle:{color:C.green,borderRadius:[3,3,0,0]}},
            {name:"NOA",type:"bar",data:bands.map(b=>mr[b]?Math.round(wavg(mr[b],"ri")):null),itemStyle:{color:C.reg,borderRadius:[3,3,0,0]}}]});
  // rinde por variedad grupo
  o=card(true,"Rendimiento por variedad · El Palomar","kg/ha ponderado");gr.appendChild(o.c);
  const rv=cg.map(x=>({k:x.k,v:x.rinde})).sort((a,b)=>b.v-a.v);
  mkChart(o.ch,{grid:{...baseGrid,left:130},tooltip:{trigger:"axis"},xAxis:{type:"value",...axStyle,...splitLine},yAxis:{type:"category",data:rv.map(x=>x.k).reverse(),...axStyle,axisLabel:{...axStyle.axisLabel,fontSize:10}},
    series:[{type:"bar",data:rv.map(x=>x.v).reverse(),itemStyle:{color:C.gold,borderRadius:[0,4,4,0]}}]});
}

/* ---- MANEJO ---- */
function secManejo(app){
  const g=grpRecs(),reg=regRecs();
  const gr=grid();app.appendChild(gr);
  // fecha por decanato
  const MO={Octubre:-1,Noviembre:0,Diciembre:1,Enero:2,Febrero:3,Marzo:4,Abril:5};
  const decKey=d=>{const p=(d||"").split(" ");const ter=p[0]&&p[0].startsWith("1-")?0:(p[0]&&p[0].startsWith("11")?1:2);const mo=MO[p[1]]!=null?MO[p[1]]:9;return mo*3+ter;};
  const DEC=[...new Set(campRecs().map(r=>r.dc).filter(Boolean))].sort((a,b)=>decKey(a)-decKey(b));
  const decShare=rs=>{const m={};let t=0;rs.forEach(r=>{if(!r.dc||!r.sc)return;m[r.dc]=(m[r.dc]||0)+r.sc;t+=r.sc;});return DEC.map(d=>t?+(100*(m[d]||0)/t).toFixed(1):0);};
  let o=card(true,"Fecha de siembra por decena","% de superficie");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,bottom:48},tooltip:{trigger:"axis",valueFormatter:v=>v+"%"},legend:{bottom:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:DEC,...axStyle,axisLabel:{...axStyle.axisLabel,rotate:30,fontSize:9}},yAxis:{type:"value",...axStyle,...splitLine,axisLabel:{...axStyle.axisLabel,formatter:"{value}%"}},
    series:[{name:"El Palomar",type:"bar",data:decShare(g),itemStyle:{color:C.green,borderRadius:[3,3,0,0]}},{name:"NOA",type:"bar",data:decShare(reg),itemStyle:{color:C.reg,borderRadius:[3,3,0,0]}}]});
  // rinde por decena
  const decRinde=rs=>DEC.map(d=>{const sub=rs.filter(r=>r.dc===d&&r.ri!=null);return sub.length?Math.round(wavg(sub,"ri")):null;});
  o=card(true,"Rendimiento por fecha de siembra","kg/ha ponderado por decena");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,bottom:48},tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:DEC,...axStyle,axisLabel:{...axStyle.axisLabel,rotate:30,fontSize:9}},yAxis:{type:"value",...axStyle,...splitLine},
    series:[{name:"El Palomar",type:"bar",data:decRinde(g),itemStyle:{color:C.green,borderRadius:[3,3,0,0]}},{name:"NOA",type:"bar",data:decRinde(reg),itemStyle:{color:C.reg,borderRadius:[3,3,0,0]}}]});
  // densidad scatter
  o=card(false,"Rinde vs densidad","sem/m² · grupo");gr.appendChild(o.c);
  mkChart(o.ch,{grid:baseGrid,tooltip:{trigger:"item",formatter:p=>`${p.value[0]} sem/m² · ${fmt(p.value[1])} kg/ha`},
    xAxis:{type:"value",name:"sem/m²",...axStyle,...splitLine},yAxis:{type:"value",name:"kg/ha",...axStyle,...splitLine},
    series:[{type:"scatter",data:g.filter(r=>r.dm2!=null&&r.ri!=null).map(r=>[r.dm2,r.ri]),symbolSize:7,itemStyle:{color:C.green}}]});
  // fósforo incorporado vs voleado
  const aplAgg=rs=>{const m={};rs.forEach(r=>{const a=(r.apl||"").toLowerCase();let k=a.includes("incorp")?"Incorporado":a.includes("vole")?"Voleado":null;if(!k)return;(m[k]=m[k]||[]).push(r);});return m;};
  const ma=aplAgg(g);
  o=card(false,"Fertilizante: incorporado vs voleado","kg/ha · grupo");gr.appendChild(o.c);
  const aplk=Object.keys(ma);
  mkChart(o.ch,{grid:baseGrid,tooltip:{trigger:"axis"},xAxis:{type:"category",data:aplk,...axStyle},yAxis:{type:"value",...axStyle,...splitLine},
    series:[{type:"bar",data:aplk.map(k=>Math.round(wavg(ma[k],"ri"))),itemStyle:{color:C.blue,borderRadius:[4,4,0,0]},label:{show:true,position:"top",formatter:p=>fmt(p.value),color:C.ink,fontSize:10}}]});
  // antecesor
  const byA={};g.forEach(r=>{if(!r.an)return;(byA[r.an]=byA[r.an]||[]).push(r);});
  const ant=Object.keys(byA).map(a=>({a,v:Math.round(wavg(byA[a],"ri")),n:byA[a].length})).filter(x=>x.n>=1).sort((a,b)=>b.v-a.v);
  o=card(true,"Rendimiento por antecesor · El Palomar","kg/ha");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,left:150},tooltip:{trigger:"axis"},xAxis:{type:"value",...axStyle,...splitLine},yAxis:{type:"category",data:ant.map(x=>x.a).reverse(),...axStyle,axisLabel:{...axStyle.axisLabel,fontSize:10}},
    series:[{type:"bar",data:ant.map(x=>x.v).reverse(),itemStyle:{color:C.green,borderRadius:[0,4,4,0]}}]});
}

/* ---- ECONÓMICO ---- */
function secEconomico(app){
  const g=grpRecs().filter(r=>r.mb!=null),reg=regRecs().filter(r=>r.mb!=null);
  if(!g.length){app.appendChild(el("div","kpi",'<div class="l">Sin datos económicos cargados para esta selección</div>'));return;}
  const mbg=wavg(g,"mb"),mbr=wavg(reg,"mb");
  app.appendChild(kpiRow([
    {l:"Margen bruto grupo",v:fmt(mbg),u:"u$s/ha"},
    {l:"Margen bruto NOA",v:fmt(mbr),u:"u$s/ha"},
    {l:"Rentabilidad grupo",v:f1(wavg(g,"rent")),u:"%"},
    {l:"Ingreso grupo",v:fmt(wavg(g,"ing")),u:"u$s/ha"},
    {l:"Lotes con dato",v:g.length},
  ]));
  const gr=grid();app.appendChild(gr);
  // MB por empresa
  const byE={};g.forEach(r=>{if(!r.em)return;(byE[r.em]=byE[r.em]||[]).push(r);});
  const emps=Object.keys(byE).map(e=>({e,v:Math.round(wavg(byE[e],"mb")),c:empColor(e)})).sort((a,b)=>b.v-a.v);
  let o=card(false,"Margen bruto por empresa","u$s/ha · líneas: promedio grupo y NOA");gr.appendChild(o.c);
  const empsR=[...emps].reverse();
  mkChart(o.ch,{grid:{...baseGrid,left:140,right:60},tooltip:{trigger:"axis"},yAxis:{type:"category",data:empsR.map(x=>x.e),...axStyle,axisLabel:{...axStyle.axisLabel,fontSize:11}},xAxis:{type:"value",...axStyle,...splitLine},
    series:[{type:"bar",data:empsR.map(x=>({value:x.v,itemStyle:{color:x.c,borderRadius:[0,4,4,0]}})),label:{show:true,position:"right",formatter:p=>fmt(p.value),color:C.ink,fontSize:10},markLine:{silent:true,symbol:"none",data:[{xAxis:Math.round(mbg),lineStyle:{color:C.green,type:"dashed"},label:{formatter:"Prom. grupo "+fmt(mbg),color:C.green,fontSize:9,position:"insideEndBottom"}},{xAxis:Math.round(mbr),lineStyle:{color:C.terra,type:"dashed"},label:{formatter:"NOA "+fmt(mbr),color:C.terra,fontSize:9,position:"insideEndTop"}}]}}]});
  // radar de costos por rubro
  const RUB=[["cse","Semilla"],["cfe","Fertilizante"],["cpq","Planteo quím."],["cfu","Fungicida"],["cla","Laboreo"],["cco","Cosecha"]];
  const empList=Object.keys(byE);
  const maxByRub={};RUB.forEach(([k])=>{maxByRub[k]=Math.max(...empList.map(e=>wavg(byE[e],k)))||1;});
  o=card(false,"Perfil de costos por rubro","% respecto de quien más gasta · tocá la leyenda para filtrar");gr.appendChild(o.c);
  const promRadar={name:"Promedio grupo",value:RUB.map(([k])=>Math.round(100*wavg(g,k)/maxByRub[k])),lineStyle:{color:C.ink,width:3},itemStyle:{color:C.ink},areaStyle:{opacity:0},symbol:"circle",symbolSize:6};
  mkChart(o.ch,{tooltip:{},legend:{bottom:0,type:"scroll",textStyle:{fontSize:11},selected:Object.fromEntries(empList.map((e,i)=>[e,i<3]))},
    radar:{indicator:RUB.map(([k,n])=>({name:n,max:100})),radius:"60%",axisName:{color:C.ink,fontSize:11},splitLine:{lineStyle:{color:C.line}},splitArea:{show:false},axisLine:{lineStyle:{color:C.line}}},
    series:[{type:"radar",data:[promRadar,...empList.map(e=>({name:e,value:RUB.map(([k])=>Math.round(100*wavg(byE[e],k)/maxByRub[k])),lineStyle:{color:empColor(e)},itemStyle:{color:empColor(e)},areaStyle:{opacity:.05}}))]}]});
  // tenencia grupo vs region
  const ten=rs=>{const m={};let t=0;rs.forEach(r=>{const k=(r.te||"s/d").trim();if(!r.sc)return;m[k]=(m[k]||0)+r.sc;t+=r.sc;});return Object.entries(m).map(([k,v])=>({name:k,value:Math.round(100*v/t)}));};
  o=card(false,"Tenencia de la tierra","% de superficie · grupo");gr.appendChild(o.c);
  mkChart(o.ch,{tooltip:{trigger:"item",valueFormatter:v=>v+"%"},legend:{bottom:0,textStyle:{fontSize:11}},
    series:[{type:"pie",radius:["40%","65%"],data:ten(grpRecs()),label:{fontSize:11},color:[C.green,C.terra,C.gold,C.reg]}]});
  // costos grupo vs region (barras por rubro)
  o=card(false,"Costos por rubro: grupo vs NOA","u$s/ha promedio");gr.appendChild(o.c);
  mkChart(o.ch,{grid:{...baseGrid,bottom:44},tooltip:{trigger:"axis"},legend:{bottom:0,textStyle:{fontSize:11}},
    xAxis:{type:"category",data:RUB.map(x=>x[1]),...axStyle,axisLabel:{...axStyle.axisLabel,rotate:30,fontSize:9}},yAxis:{type:"value",...axStyle,...splitLine},
    series:[{name:"El Palomar",type:"bar",data:RUB.map(([k])=>Math.round(wavg(g,k))),itemStyle:{color:C.green,borderRadius:[3,3,0,0]}},
            {name:"NOA",type:"bar",data:RUB.map(([k])=>Math.round(wavg(reg,k))),itemStyle:{color:C.reg,borderRadius:[3,3,0,0]}}]});
}

/* ============ carga de CSV nuevo ============ */
const CUIC2EMP={"NOA346003M":"Ganadera del Nordeste","NOA346004M":"Izcayacu","NOA346006M":"La Ronda","NOA346009M":"La Pachita","NOA346011M":"Ruben Garcia","NOA346013M":"Maika","NOA346014M":"Molles","NOA346015M":"APUNOA CD"};
const NUM=v=>{const s=String(v==null?"":v).trim().replace(",",".");if(s===""||s==="None")return null;const n=parseFloat(s);return isNaN(n)?null:n;};
const STR=v=>{const s=(v==null?"":String(v)).trim();return s&&s!=="None"?s:null;};
function parseCsvRow(x){
  const pal=(x.crea||"").toUpperCase().includes("PALOMAR");
  let apl=null;for(let i=1;i<=6;i++){const a=STR(x["fertilizante_"+i+"_aplicacion"]);if(a){apl=a;break;}}
  return{cp:x.campana==="2025-26"?"2526":(x.campana==="2024-25"?"2425":x.campana),gr:pal?1:0,em:pal?(CUIC2EMP[(x.cuic||"").trim()]||null):null,
    zo:STR(x.zona),pr:STR(x.provincia),de:STR(x.departamento),te:STR(x.tenencia),ss:NUM(x.sup_sembrada),sc:NUM(x.sup_cosechada),
    ri:NUM(x.rendimiento_sup_cosechada),an:STR(x.antecesor),va:STR(x.genetica)||STR(x.version_biotecnologica),ci:STR(x.ciclo),
    fs:STR(x.fecha_siembra),dc:STR(x.decanato_fecha_siembra),dm2:NUM(x.densidad_sem_m2),pl:NUM(x.poblacion_pl_ha),
    pp:NUM(x.pp_campana),ppm:["pp_sep","pp_oct","pp_nov","pp_dic","pp_ene_2","pp_feb_2","pp_mar_2","pp_abr_2","pp_may_2"].map(k=>NUM(x[k])),
    amb:STR(x.calidad_ambiente),fe:STR(x.fertilizacion),N:NUM(x.nitrogeno_kg_ha),P:NUM(x.fosforo_kg_ha),S:NUM(x.azufre_kg_ha),Zn:NUM(x.zinc_kg_ha),apl:apl,
    ing:NUM(x.ingreso_bruto_predictivo),cse:NUM(x.costo_semillas_predictivo),cfe:NUM(x.costo_fertilizantes_predictivo),cpq:NUM(x.planteo_quimico_predictivo),
    cfu:NUM(x.costo_fungicidas_predictivo),cla:NUM(x.costo_laboreos_predictivo),cco:NUM(x.costo_cosecha_predictivo),mb:NUM(x.margen_bruto_predictivo),rent:NUM(x.rentabilidad_predictivo)};
}
document.getElementById("btnUpload").onclick=()=>document.getElementById("fileCsv").click();
document.getElementById("fileCsv").onchange=e=>{const f=e.target.files[0];if(!f)return;
  Papa.parse(f,{header:true,delimiter:";",skipEmptyLines:true,complete:res=>{
    const recs=res.data.filter(x=>x.cultivo==="Soja").map(parseCsvRow);
    if(!recs.length){alert("No encontré lotes de Soja en el CSV.");return;}
    DATA.records=recs;const cps=[...new Set(recs.map(r=>r.cp))].sort().reverse();state.cp=cps[0];
    alert("Cargados "+recs.length+" lotes de soja. Actualizando.");render();
  },error:err=>alert("Error al leer el CSV: "+err)});};

/* init */
render();
</script>
</body>
</html>
